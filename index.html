<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Atlas Motors</title>

  <style>
    :root {
      --bg-light: #f4f5f7;
      --bg-dark: #05060a;
      --card-light: #ffffff;
      --card-dark: #111320;
      --text-light: #0b0c10;
      --text-dark: #f7f7ff;
      --accent: #ff4b4b;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg-light);
      color: var(--text-light);
      transition: 0.3s ease;
    }

    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    /* ⭐ FIXED TOP BAR — EVERYTHING WHITE */
    .topbar {
      background: #0a1a3a;
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #ffffff !important;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .top-nav {
      display: flex;
      gap: 0.5rem;
    }

    .top-nav button {
      background: transparent;
      color: #ffffff !important;
      border: 1px solid rgba(255,255,255,0.7) !important;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s;
    }

    .top-nav button:hover {
      background: #ffffff;
      color: #0a1a3a !important;
    }

    /* HERO */
    .hero {
      padding: 3rem 1.5rem 2rem;
      background: radial-gradient(circle at top, #2b2f55, #05060a);
      color: white;
      position: relative;
    }

    body.light .hero {
      background: radial-gradient(circle at top, #d7e3ff, #7f8bb8);
      color: #0b0c10;
    }

    .fog-layer {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,0.18), transparent 55%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.12), transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(255,255,255,0.16), transparent 60%);
      opacity: 0.4;
      pointer-events: none;
    }

    /* COMPARE SECTION */
    .compare-section {
      padding: 2rem 1.5rem;
      max-width: 1100px;
      margin: auto;
    }

    .focus-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    #focusSelect {
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #aaa;
    }

    body.dark #focusSelect {
      background: #111320;
      color: white;
      border-color: #666;
    }

    .cars-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .car-card {
      background: var(--card-light);
      padding: 1rem;
      border-radius: 1rem;
      box-shadow: 0 14px 30px rgba(0,0,0,0.08);
    }

    body.dark .car-card {
      background: var(--card-dark);
      color: white;
    }

    /* AI SECTION */
    .ai-section {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1.5rem;
      border-radius: 1rem;
      background: #111320;
      color: white;
    }

    body.light .ai-section {
      background: #f7e3ff;
      color: #0b0c10;
    }

    .ai-btn {
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      border: none;
      background: white;
      color: #111320;
      cursor: pointer;
      font-weight: 600;
    }

    body.light .ai-btn {
      background: #111320;
      color: white;
    }

    .ai-output {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 0.8rem;
      background: rgba(255,255,255,0.15);
    }

    body.light .ai-output {
      background: rgba(0,0,0,0.1);
    }
  </style>
</head>

<body class="light">

  <header class="topbar">
    <div class="logo">Atlas Motors</div>
    <nav class="top-nav">
      <button class="nav-btn">Home</button>
      <button class="nav-btn">Compare</button>
      <button class="nav-btn">About</button>
      <button class="theme-toggle" id="themeToggle">Light</button>
    </nav>
  </header>

  <section class="hero">
    <div class="fog-layer"></div>
    <h1>Compare cars</h1>
    <p>Choose a focus and let Atlas Motors help you decide.</p>
  </section>

  <section class="compare-section">
    <div class="focus-row">
      <label>Focus:</label>
      <select id="focusSelect">
        <option value="balanced">Balanced</option>
        <option value="daily">Daily use</option>
        <option value="fast">Fast / track</option>
        <option value="cheap">Cheap / budget</option>
        <option value="summer">Summer fun</option>
        <option value="winter">Winter / bad roads</option>
        <option value="weekend">Weekend toy</option>
      </select>
    </div>

    <div class="cars-row">
      <div class="car-card">
        <h2>Bugatti Chiron</h2>
        <p>HP: 1500</p>
        <p>Fast: 10/10</p>
      </div>

      <div class="car-card">
        <h2>Bugatti Veyron</h2>
        <p>HP: 1001</p>
        <p>Fast: 10/10</p>
      </div>
    </div>
  </section>

  <section class="ai-section">
    <h2>Atlas AI helper</h2>
    <button id="askAiBtn" class="ai-btn">Ask Atlas AI</button>
    <div id="aiOutput" class="ai-output">Atlas AI opinion will appear here.</div>
  </section>

  <script>
    // THEME TOGGLE
    const themeToggle = document.getElementById("themeToggle");
    const body = document.body;

    themeToggle.addEventListener("click", () => {
      body.classList.toggle("dark");
      body.classList.toggle("light");
      themeToggle.textContent = body.classList.contains("dark") ? "Dark" : "Light";
    });

    // AI OPINIONS
    const aiOpinions = {
      balanced: [
        "A balanced pick mixes comfort and speed without going extreme.",
        "For balance, choose the car that performs well everywhere.",
        "A good all‑rounder should feel stable, smooth, and quick."
      ],
      daily: [
        "Daily use needs comfort, fuel efficiency, and easy driving.",
        "For daily driving, choose the car that feels relaxing.",
        "A good daily car should be smooth, quiet, and predictable."
      ],
      fast: [
        "For speed, the car with the best acceleration wins.",
        "Track focus needs grip, braking, and stability.",
        "If you want pure speed, choose the one with the best power‑to‑weight."
      ],
      cheap: [
        "Budget focus means low running costs and simple parts.",
        "Choose the car that won’t drain your wallet every month.",
        "Cheap doesn’t mean bad — it means smart and efficient."
      ],
      summer: [
        "Summer fun means loud engines and open roads.",
        "Choose the car that makes you smile on sunny days.",
        "A fun summer car should feel light and playful."
      ],
      winter: [
        "Winter needs grip, stability, and confidence.",
        "Choose the car that handles snow and rain safely.",
        "Bad roads need predictable handling and traction."
      ],
      weekend: [
        "A weekend toy should feel special every time.",
        "Choose the car that makes you excited to drive.",
        "Weekend cars are about emotion, not logic."
      ]
    };

    const focusSelect = document.getElementById("focusSelect");
    const askAiBtn = document.getElementById("askAiBtn");
    const aiOutput = document.getElementById("aiOutput");

    askAiBtn.addEventListener("click", () => {
      const focus = focusSelect.value;
      const list = aiOpinions[focus];
      const random = list[Math.floor(Math.random() * list.length)];
      aiOutput.textContent = "Atlas AI opinion: " + random;
    });
  </script>

</body>
</html>
