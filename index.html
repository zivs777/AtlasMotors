<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Selector</title>
<link rel="stylesheet" href="style.css">
</head>

<body data-theme="light">

<header>
  <h1>Car Selector</h1>
  <button id="themeToggle">Toggle Theme</button>
</header>

<section id="carGrid" class="grid"></section>

<section id="compareSection">
  <h2>Compare Cars</h2>
  <div id="compareList"></div>
  <button id="resetCompareBtn">Reset Compare</button>
</section>

<section id="aiOpinionSection">
  <h2>AI Opinion</h2>
  <p id="aiOpinionText">Select 2–3 cars and choose a focus to get a custom opinion.</p>
  <button id="aiOpinionBtn">Generate AI Opinion</button>
</section>

<section id="funGarage">
  <h2>Fun Garage</h2>
  <div id="funGarageList"></div>
</section>

<div id="modal" class="hidden">
  <div id="modalContent"></div>
</div>

<script>
// ------------------ DATA ------------------
const cars = [
  { id: "gtr", name: "Nissan GTR", hp: 565, img: "gtr.jpg" },
  { id: "supra", name: "Toyota Supra", hp: 382, img: "supra.jpg" },
  { id: "m4", name: "BMW M4", hp: 503, img: "m4.jpg" }
];

const soundCars = [
  { id: "gtr", sound: "gtr.mp3" },
  { id: "supra", sound: "supra.mp3" },
  { id: "m4", sound: "m4.mp3" }
];

let compareList = [];

// ------------------ RENDER FUNCTIONS ------------------
function updateCarsView() {
  const grid = document.getElementById("carGrid");
  grid.innerHTML = cars.map(car => `
    <div class="carCard">
      <img src="${car.img}" alt="${car.name}">
      <h3>${car.name}</h3>
      <p>${car.hp} HP</p>
      <button data-id="${car.id}" data-action="details">Details</button>
      <button data-id="${car.id}" data-action="compare">Compare</button>
      <button data-id="${car.id}" data-action="rev">Rev</button>
    </div>
  `).join("");
}

function renderCompare() {
  const box = document.getElementById("compareList");
  box.innerHTML = compareList.map(car => `
    <div class="compareCard">
      <h4>${car.name}</h4>
      <p>${car.hp} HP</p>
    </div>
  `).join("");
}

function renderFunGarage() {
  document.getElementById("funGarageList").innerHTML = `
    <p>Your garage will appear here soon!</p>
  `;
}

function renderCarOfTheDay() {}
function updateYearLabel() {}

// ------------------ MODAL ------------------
const modal = document.getElementById("modal");
function openModal(car) {
  document.getElementById("modalContent").innerHTML = `
    <h2>${car.name}</h2>
    <p>${car.hp} HP</p>
  `;
  modal.classList.remove("hidden");
}

modal.addEventListener("click", (e) => {
  if (e.target === modal) modal.classList.add("hidden");
});

// ------------------ THEME ------------------
document.getElementById("themeToggle").addEventListener("click", () => {
  const current = document.body.getAttribute("data-theme");
  document.body.setAttribute("data-theme", current === "dark" ? "light" : "dark");
});

// ------------------ AI OPINION ------------------
document.getElementById("aiOpinionBtn").addEventListener("click", () => {
  document.getElementById("aiOpinionText").textContent =
    "AI thinks these cars are awesome together!";
});

// ------------------ RESET COMPARE ------------------
document.getElementById("resetCompareBtn").addEventListener("click", () => {
  compareList = [];
  renderCompare();
  document.getElementById("aiOpinionText").textContent =
    "Select 2–3 cars and choose a focus to get a custom opinion.";
});

// ------------------ REV SOUND ------------------
function playRevSound(car) {
  const audio = new Audio(car.sound);
  audio.play();
}

// ------------------ CLICK HANDLER ------------------
document.body.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;

  const id = btn.dataset.id;
  const action = btn.dataset.action;
  if (!action) return;

  if (!id && action !== "rev") return;

  if (action === "rev") {
    const car = soundCars.find(c => c.id === id);
    if (car) playRevSound(car);
    return;
  }

  if (id) {
    const car = cars.find(c => c.id === id);
    if (!car) return;

    if (action === "details") {
      openModal(car);
      return;
    }

    if (action === "compare") {
      if (compareList.find(c => c.id === car.id)) return;
      if (compareList.length >= 3) compareList.shift();
      compareList.push(car);
      renderCompare();
      return;
    }
  }
});

// ------------------ INITIAL LOAD ------------------
updateYearLabel();
renderCarOfTheDay();
updateCarsView();
renderCompare();
renderFunGarage();
</script>

</body>
</html>
